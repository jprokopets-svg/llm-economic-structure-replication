name: ball_baseline
period: quarterly
n_history_periods: 60

targets:
  r_star: 2.0
  pi_star: 2.0
  e_star: 0.0
  u_star: 5.0
  r_world: 2.0

is_curve:
  output_persistence: 0.8
  interest_sensitivity: 0.6
  exchange_sensitivity: 0.2

phillips_curve:
  inflation_persistence: 0.95      # < 1 removes unit root; Gali (2008), Stock & Watson (1999)
  output_slope: 0.4
  exchange_passthrough: 0.2

taylor_rule:
  inflation_coefficient: 1.5
  output_coefficient: 2.0       # elevated from Taylor (1993) original 0.5;
                                # necessary for stability with rho=0.85 in backward-looking model;
                                # CGG (2000) estimate ~0.93 at rho=0.79
  smoothing_rho: 0.85           # Dotsey & Sill (2015); FRB/US model uses rho=0.85

uip:
  interest_differential: 2.0

okun:
  coefficient: 0.5

shocks:
  sigma_y: 0.7    # bumped from 0.5 to compensate for smoothing-induced volatility reduction
  sigma_pi: 0.4   # bumped from 0.3
  sigma_e: 1.5    # bumped from 1.0

initial_conditions:
  y_0: 0.0
  pi_0: 2.0
  r_0: 2.0
  e_0: 0.0
  e_minus1: 0.0     # needed for Phillips lag on delta-e
